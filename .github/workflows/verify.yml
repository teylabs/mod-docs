name: Verify docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      mod_ref:
        description: 'teylabs/mod branch, tag, or commit to verify'
        required: true
        default: main
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        laravel: [12, 13]
    name: Laravel ${{ matrix.laravel }}
    env:
      MOD_REF: ${{ inputs.mod_ref || 'main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sqlite, pdo_sqlite
          tools: composer:v2
          coverage: none
      - name: Install zsh
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Locate Composer cache
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: docs-composer-${{ runner.os }}-L${{ matrix.laravel }}-${{ github.run_id }}
          restore-keys: docs-composer-${{ runner.os }}-L${{ matrix.laravel }}-
      - name: Create the fresh app from the mod ref
        run: verify/setup.sh "$RUNNER_TEMP/docs-verify" "git:$MOD_REF" "${{ matrix.laravel }}"
      - name: Verify documented examples
        run: verify/run.sh "$RUNNER_TEMP/docs-verify" "${{ matrix.laravel }}"
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-verify-laravel-${{ matrix.laravel }}
          path: |
            ${{ runner.temp }}/docs-verify/verify.txt
            ${{ runner.temp }}/docs-verify/mod-ref.txt
          if-no-files-found: warn
